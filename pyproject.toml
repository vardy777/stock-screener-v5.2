[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener-v5-2"
version = "5.2.0"
description = "Standalone after-close A-share alpha research foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["build>=1,<2"]
audit = ["baostock==0.9.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["v5_2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
